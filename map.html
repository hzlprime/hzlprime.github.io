<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map | Hazal İnce</title>
  
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="map.css">

  <link rel="icon" type="image/png" href="images/my_favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700;800&display=block" as="style">
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700;800&display=block" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <!-- Floating Navigation Bar -->
  <header class="navbar">
    <div class="site-container nav-inner">
      <a href="index.html" class="brand brand-link">
        <div class="brand-name">Hazal İnce</div>
        <div class="brand-subtitle">Portfolio Website</div>
      </a>
      <nav class="nav-links">
        <a href="index.html#missions" class="nav-link">MISSIONS</a>
        <a href="player.html" class="nav-link">PLAYER</a>
        <a href="map.html" class="nav-link active-nav">MAP</a>
      </nav>
    </div>
  </header>

  <!-- MAIN MAP WRAPPER -->
  <main class="map-page-layout site-container">

    <section class="map-header">
      <h1 class="map-page-title">Professional &amp; Studies</h1>
      <p class="map-instruction">Select a city beacon on the map to inspect academic terms and studio missions.</p>
    </section>

    <!-- RELATIVE COORDINATE MAP CANVAS -->
    <section class="map-canvas-wrapper">
      <img src="images/map2.png" alt="Europe and Turkey Coordinate Map" class="map-base-img">


    </section>

  </main>

  <!-- Static Footer -->
  <footer class="footer">
    <div class="site-container footer-inner">
      <div class="footer-text">Portfolio Website . Hazal Ince</div>
      <div class="social-links">
        <a href="https://linkedin.com" target="_blank" class="social-icon"><i class="fa-brands fa-linkedin-in"></i></a>
        <a href="https://artstation.com" target="_blank" class="social-icon"><i class="fa-brands fa-artstation"></i></a>
      </div>
    </div>
  </footer>

  <!-- Interactive Coordinate Controller -->
  <script>
    function toggleCity(cardId) {
      const targetCard = document.getElementById(cardId);
      if (!targetCard) return;

      const isMobile = window.innerWidth <= 768;
      const isAlreadyOpen = targetCard.classList.contains('is-active');

      if (isMobile) {
        document.querySelectorAll('.city-card').forEach(card => {
          card.classList.remove('is-active');
        });

        if (!isAlreadyOpen) {
          targetCard.classList.add('is-active');
        }
      } else {
        targetCard.classList.toggle('is-active');
      }
    }

    function closeCity(cardId) {
      const targetCard = document.getElementById(cardId);
      if (targetCard) {
        targetCard.classList.remove('is-active');
      }
    }
  </script>

</body>
</html>
